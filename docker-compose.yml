secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  csrf_token:
    file: ./secrets/csrf_token.txt

volumes:
  backend_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

services:
  # ──────────────────────────────────────────────
  # Backend — несколько реплик для горизонтального
  # масштабирования. Порты наружу не выставляются,
  # все запросы идут через backend-lb.
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-momo}/momo-store-backend:latest
    restart: unless-stopped
    # container_name убран — при нескольких репликах
    # Docker сам генерирует уникальные имена.
    # ports убраны — backend доступен только через LB.
    environment:
      - APP_ADDRESS=:8081
      - APP_LOG_LEVEL=info
    secrets:
      - jwt_secret
      - csrf_token
    volumes:
      - backend_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

  # ──────────────────────────────────────────────
  # Backend Load Balancer — Nginx, который
  # распределяет входящие запросы между репликами
  # backend. Использует стратегию least_conn.
  # ──────────────────────────────────────────────
  backend-lb:
    build:
      context: ./nginx-lb
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-momo}/momo-store-backend-lb:latest
    container_name: momo-store-backend-lb
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /tmp

  # ──────────────────────────────────────────────
  # Frontend — обращается к API через backend-lb
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VUE_APP_API_URL=http://localhost:8081
    image: ${DOCKER_USER:-momo}/momo-store-frontend:latest
    container_name: momo-store-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VUE_APP_API_URL=http://localhost:8081
    networks:
      - frontend_net
    depends_on:
      backend-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /tmp

  # Development profiles
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-momo}/momo-store-backend:dev
    container_name: momo-store-backend-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - APP_ADDRESS=:8081
      - APP_LOG_LEVEL=debug
    volumes:
      - ./backend:/app
    networks:
      - backend_net
    profiles:
      - dev
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-momo}/momo-store-frontend:dev
    container_name: momo-store-frontend-dev
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VUE_APP_API_URL=http://localhost:8081
    volumes:
      - ./frontend:/app
    networks:
      - frontend_net
    depends_on:
      - backend
    profiles:
      - dev
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M