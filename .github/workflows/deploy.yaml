name: Docker Project Deploy

on:
  push:
    branches:
      - main

jobs:
  # ---------- Security Scan ----------
  security-scan:
    name: Security scan with Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ---------- Build and Push to Docker Hub ----------
  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Backend to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest

      - name: Push Frontend to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest

      - name: Push nginx-lb to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./nginx-lb/
          push: true
          tags: ${{ secrets.DOCKER_USER }}/docker-project-nginx-lb:latest

  # ---------- Run with Docker Compose ----------
  run-with-docker-compose:
    name: Run with Docker Compose
    needs: build_and_push_to_docker_hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build via Docker Compose
        uses: hoverkraft-tech/compose-action@v2.2.0