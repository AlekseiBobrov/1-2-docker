upstream backend {
    # Используем least_conn — запрос направляется на сервер с наименьшим
    # количеством активных соединений. Это даёт равномерную нагрузку.
    least_conn;

    # Docker DNS автоматически разрешает "backend" во все IP реплик сервиса
    server backend:8081;
}

server {
    listen 8081;

    # Прокси на backend-серверы
    location / {
        proxy_pass http://backend;

        # Прокидываем оригинальные заголовки запроса
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для предотвращения зависания соединений
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Буферизация ответов
        proxy_buffering on;
        proxy_buffer_size   4k;
        proxy_buffers       8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint — проверяем один из backend'ов
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}